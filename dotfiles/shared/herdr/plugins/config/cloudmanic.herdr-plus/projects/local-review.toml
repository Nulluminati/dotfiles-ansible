name = "local-review"
description = "Review local changes with Pi, Claude Code, and Hunk"
working_dir = "{prompt}"

[[tabs]]
name = "review"

[[tabs.panes]]
command = """sh -c 'config=$(herdr plugin config-dir cloudmanic.herdr-plus) && exec uv run --no-project --script "$config/bin/herdr_workflow.py" review-agent local-review pi'"""

[[tabs.panes]]
command = """sh -c 'config=$(herdr plugin config-dir cloudmanic.herdr-plus) && exec uv run --no-project --script "$config/bin/herdr_workflow.py" review-hunk local-review'"""
split = "right"
ratio = 0.5

[[tabs.panes]]
command = """sh -c 'config=$(herdr plugin config-dir cloudmanic.herdr-plus) && exec uv run --no-project --script "$config/bin/herdr_workflow.py" layout-claude local-review'"""
split = "down"
ratio = 0.5

[[tabs]]
name = "files"
command = "yazi"

[[tabs]]
name = "shell"
