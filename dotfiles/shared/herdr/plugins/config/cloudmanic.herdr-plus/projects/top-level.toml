name = "top-level"
description = "Herdboard board over a thin shell, with a file explorer tab"
working_dir = "{prompt}"

[[tabs]]
name = "board"

[[tabs.panes]]
command = """sh -c 'root=$(herdr plugin list --plugin nulluminati.herdboard --json | jq -r ".result.plugins[0].plugin_root") && exec uv run --quiet --project "$root" herdboard board'"""

[[tabs.panes]]
split = "down"
ratio = 0.15

[[tabs]]
name = "files"
command = "yazi"
