# Last in the file: this project holds every other project's directory, so a
# project above it claims its own workspace first. The label still matches the
# Projects workspace before any directory does.
[[projects]]
label = "Projects"
path = "~/Projects"

[[projects.tabs]]
name = "board"

[[projects.tabs.panes]]
label = "board"
command = """sh -c 'root=$(herdr plugin list --plugin nulluminati.herdboard --json | jq -r ".result.plugins[0].plugin_root") && exec uv run --quiet --project "$root" herdboard board'"""

[[projects.tabs.panes]]
split = "down"
ratio = 0.85
