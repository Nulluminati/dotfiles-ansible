onboarding = false

[ui]
status_indicators = "symbols"
pane_borders = "always"
pane_outer_borders = true

[ui.sidebar.spaces]
# Line 1: the project. A card workspace shows its own name, which is its branch name.
# Line 2: the herdboard card, else the branch. herdboard card branches hide by their prefix.
rows = [
  ["state_icon", "$workflow_project", { token = "workspace", rules = [
    { starts_with = "implementation · ", hide = true },
    { starts_with = "top-level · ", hide = true },
    { starts_with = "local-review · ", hide = true },
    { starts_with = "pr-review · ", hide = true },
  ] }],
  ["$herdboard_card", { token = "branch", rules = [
    { starts_with = "feat/t", hide = true },
    { starts_with = "fix/t", hide = true },
    { starts_with = "chore/t", hide = true },
    { starts_with = "docs/t", hide = true },
    { starts_with = "refactor/t", hide = true },
    { starts_with = "test/t", hide = true },
    { starts_with = "perf/t", hide = true },
  ] }, "git_status"],
  ["$resource_usage"],
]

[ui.sidebar.agents]
# One layout for every agent. Rows whose tokens have no value disappear.
# $herdboard_card: the herdboard card that `herdboard start` gave the agent.
rows = [
  ["state_icon", { token = "$agent_icon", rules = [{ equals = "", fg = "#D97757" }] }],
  ["tab"],
  ["$herdboard_card"],
  ["$pi_workers"],
  ["$claude_context", "$claude_cost", "$pi_context", "$pi_cost", "$codex_context", "$codex_cost"],
]

[terminal]
# terminal-browser draws pages with the kitty graphics protocol.
kitty_graphics = true

[theme]
name = "terminal"
auto_switch = false

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = true

[[keys.command]]
key = "prefix+up"
type = "plugin_action"
command = "cloudmanic.herdr-plus.projects"
description = "Open project workflows"

[[keys.command]]
key = "prefix+down"
type = "plugin_action"
command = "cloudmanic.herdr-plus.quick-actions"
description = "Open Quick Actions"

[[keys.command]]
key = "prefix+shift+h"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review"
description = "hunk: review changes"

[[keys.command]]
key = "prefix+shift+s"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.send-review"
description = "hunk: send review to agent"

[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review:commit"
description = "hunk: review the last commit"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review:staged"
description = "hunk: review staged changes"

[[keys.command]]
key = "prefix+shift+p"
type = "plugin_action"
command = "nulluminati.peer-review.request"
description = "peer review: ask the other agent to review uncommitted changes"

[[keys.command]]
key = "prefix+shift+b"
type = "plugin_action"
command = "nulluminati.herdboard.board"
description = "herdboard: open the kanban board"
