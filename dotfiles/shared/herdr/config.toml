onboarding = false

[ui]
status_indicators = "symbols"
pane_borders = "always"
pane_outer_borders = true

[ui.sidebar.agents]
rows = [
  ["state_icon", "agent", "state_text"],
  ["workspace", "tab"],
]

[ui.sidebar.agents.rows_by_agent]
pi = [
  ["state_icon", "agent"],
  ["$pi_session_name"],
  ["$pi_messenger"],
  ["$pi_mission", "$pi_mission_status"],
  ["$pi_workers", "$pi_cost"],
  ["$pi_todos", "$pi_goal"],
]
claude = [
  ["state_icon", "agent", "state_text"],
  ["terminal_title_stripped"],
  ["workspace", "tab"],
]

[theme]
name = "terminal"
auto_switch = false

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = true
