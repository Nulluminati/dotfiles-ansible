---
- name: Install command line tools in Fedora
  ansible.builtin.import_tasks: fedora.yml
  when: ansible_facts.distribution == "Fedora"

- name: Install command line tools in macOS
  ansible.builtin.import_tasks: mac.yml
  when: ansible_facts.distribution == "MacOSX"

- name: Install zoxide directory history
  ansible.builtin.import_tasks: zoxide.yml
  tags:
    - install
    - zoxide
