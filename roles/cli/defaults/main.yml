---
# DNF packages to install
cli_dnf_packages:
  - alacritty
  - autorandr
  - bat
  - chromium
  - conky
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
  - dunst
  - eza
  - fd-find
  - feh
  - firefox
  - fish
  - fzf
  - gh
  - git-delta
  - ghostty
  - helm
  - htop
  - intel-gpu-tools
  - intel-media-driver
  - libva-utils
  - libcap
  - i3
  - ImageMagick
  - jq
  - keepassxc
  - kubectl
  - neofetch
  - neovim
  - picom
  - pipewire-utils
  - polybar
  - python3-pip
  - ripgrep
  - rofi
  - rust
  - rustfmt
  - starship
  - rust-analyzer
  - sublime-text
  - terraform
  - tig
  - opentofu
  - tmux
  - golang
  - golang-x-tools-gopls
  - ruby
  - rubygems
  - unzip
  - wireplumber
  - xclip

# Fish plugins to install via fisher
fish_plugins:
  - gazorby/fish-abbreviation-tips
  - jethrokuan/z
  - jorgebucaran/nvm.fish
  - PatrickF1/fzf.fish

# Node.js versions to install via nvm.fish
node_versions:
  - 18.16.0
  - latest

# Bun packages to install globally
bun_packages:
  - gatsby-cli@5.11.0
  - resume-cli@3.0.8

# GitHub CLI extensions to install
gh_extensions:
  - dlvhdr/gh-dash

# Flatpak applications to install from Flathub.
# Add reverse-DNS app IDs here (see https://flathub.org). The Flathub remote
# is registered automatically by the cli role on first run.
flatpak_packages:
  - md.obsidian.Obsidian

# Flathub repository file used to register the Flathub remote.
flathub_repo_url: https://dl.flathub.org/repo/flathub.flatpakrepo

fedora_repositories:
  - name: docker-ce-stable
    description: Docker CE Stable - $basearch
    url: https://download.docker.com/linux/fedora/$releasever/$basearch/stable
    gpg_url: https://download.docker.com/linux/fedora/gpg
    gpg_check: true

  - name: hashicorp
    description: Hashicorp Stable - $basearch
    url: https://rpm.releases.hashicorp.com/fedora/$releasever/$basearch/stable
    gpg_url: https://apt.releases.hashicorp.com/gpg
    gpg_check: true

  - name: Kubernetes
    description: Kubernetes
    url: https://pkgs.k8s.io/core:/stable:/v1.31/rpm/
    gpg_url: https://pkgs.k8s.io/core:/stable:/v1.31/rpm/repodata/repomd.xml.key
    gpg_check: true

  - name: sublime-text
    description: Sublime Text x86_64 - stable
    url: https://download.sublimetext.com/rpm/stable/x86_64
    gpg_url: https://download.sublimetext.com/sublimehq-rpm-pub.gpg
    gpg_check: true

copr_repositories:
  - name: atim/starship
    creates: _copr:copr.fedorainfracloud.org:atim:starship.repo
  - name: scottames/ghostty
    creates: _copr:copr.fedorainfracloud.org:scottames:ghostty.repo
  - name: "@go-sig/golang-rawhide"
    creates: _copr:copr.fedorainfracloud.org:group_go-sig:golang-rawhide.repo

# Homebrew taps to configure on macOS
mac_homebrew_taps:
  - hashicorp/tap # terraform
  - norwoodj/tap # helm-docs
  - puma/puma # puma-dev
  - vectordotdev/brew # vector
  - warrensbox/tap # tgswitch

# Homebrew cask apps to install on macOS
mac_cask_packages:
  - alacritty # Cross-platform, GPU-accelerated terminal emulator
  - aws-vpn-client # AWS VPN Client
  - betterdisplay # Display management utility
  - chatgpt # OpenAI ChatGPT desktop app
  - claude # Claude desktop app
  - cursor # AI-first code editor
  - docker # Docker Desktop
  - firefox # Mozilla Firefox web browser
  - font-source-code-pro # Monospaced font family for user interface and coding environments
  - kap # Screen recorder
  - keepassxc # Password manager
  - linearmouse # LinearMouse - Linear mouse acceleration
  - ngrok # Expose localhost to the internet
  - notion # Notes and knowledge base
  - obsidian # Markdown knowledge base
  - slack # Team messaging
  - spotify # Music streaming
  - sublime-text # Text editor

# Homebrew formulae to install on macOS
mac_brew_packages:
  - awscli # Official Amazon AWS command-line interface
  - bash # Bourne-Again SHell, a UNIX command interpreter
  - bat # Clone of cat with syntax highlighting and Git integration
  - check-jsonschema # JSON Schema validator
  - codex # OpenAI Codex CLI coding agent
  - dive # Tool for exploring each layer in a docker image
  - eza # Modern, maintained replacement for ls
  - fd # Simple, fast and user-friendly alternative to 'find'
  - fzf # Command-line fuzzy finder written in Go
  - git # Distributed revision control system
  - git-delta # Syntax-highlighting pager for git and diff output
  - grep # GNU grep, egrep and fgrep
  - helm # The Kubernetes Package Manager
  - helm-docs # Generate documentation for your Helm charts
  - htop # Interactive process viewer (improved top)
  - jq # Lightweight and flexible command-line JSON processor
  - kubectx # Faster way to switch between clusters and namespaces in kubectl
  - kubernetes-cli # Kubernetes command-line interface
  - make # Utility for directing compilation
  - minikube # Run a Kubernetes cluster locally
  - mise # Polyglot runtime manager (asdf-compatible)
  - neovim # Ambitious Vim-fork focused on extensibility and agility
  - node # Platform built on V8 to build network applications
  - pre-commit # Framework for managing multi-language pre-commit hooks
  - ripgrep # Search tool like grep and The Silver Searcher
  - starship # Cross-shell prompt for astronauts
  - tgswitch # Switch between different versions of terraform
  - tmux # Terminal multiplexer
  - tree # Display directories as trees (with optional color/HTML output)
  - vector # High-performance, open-source, observability data pipeline
  - watch # Executes a program periodically, showing output fullscreen
  - vim # Vi 'workalike' with many additional features
  - wget # Internet file retriever
  - yamllint # Linter for YAML files
  - yq # Command-line YAML processor - jq wrapper for YAML documents
  - zsh # UNIX shell (command interpreter)
  - zsh-autosuggestions # Fish-like fast/unobtrusive autosuggestions for zsh
  - zsh-syntax-highlighting # Fish shell-like syntax highlighting for zsh
