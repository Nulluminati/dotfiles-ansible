---
- name: Check if uv is available
  block:
    - name: Check if uv command exists
      ansible.builtin.raw: which uv
      check_mode: false
      changed_when: false
      failed_when: which_res.rc > 1
      register: which_res

    - name: uv available
      debug:
        msg: uv is installed

  rescue:
    - name: No uv
      debug:
        msg: uv is not installed
      ignore_errors: true
  tags:
    - llm
    - uv

- name: Install llm and additional tools with uv
  shell: uv tool install {{ item }}
  loop: "{{ uv_packages }}"
  tags:
    - llm
    - uv

- name: Locate uv tools directory
  command: uv tool dir
  register: uv_tools_dir
  changed_when: false
  tags:
    - llm
    - plugins

# llm >= 0.35 and its SDK dependencies (openai, anthropic) use the renamed
# httpx2 package, so the legacy httpx module is no longer pulled in
# transitively. Several plugins (llm-docs, llm-openrouter, llm-hacker-news,
# the fragments/templates plugins) still import httpx directly.
- name: Install legacy httpx into the llm tool environment
  command: uv pip install --python {{ uv_tools_dir.stdout }}/llm/bin/python httpx
  register: llm_httpx_install
  changed_when: "'Installed' in llm_httpx_install.stdout"
  tags:
    - llm
    - plugins

- name: Install additional llm models & plugins
  shell: llm install -U {{ item }}
  loop: "{{ llm_plugins }}"
  tags:
    - llm
    - plugins

- name: Set llm api keys for fedora
  when: ansible_distribution == "Fedora"
  template:
    src: templates/llm_keys.json.j2
    dest: "{{ ansible_env.HOME }}/.config/io.datasette.llm/keys.json"
  tags:
    - llm
    - config

- name: Set llm api keys for mac
  when: ansible_distribution == "MacOSX"
  template:
    src: templates/llm_keys.json.j2
    dest: "{{ ansible_env.HOME }}/Library/Application Support/io.datasette.llm/keys.json"
  tags:
    - llm
    - config
