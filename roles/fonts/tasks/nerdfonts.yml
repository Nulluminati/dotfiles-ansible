---
- name: Set fonts directory
  ansible.builtin.set_fact:
    fonts_dir: "{{ (ansible_facts.distribution == 'Fedora') | ternary(fedora_font_dir, mac_font_dir) }}"
  tags:
    - fonts

- name: Ensure Fonts directory exists.
  become: "{{ (ansible_facts.distribution == 'Fedora') | ternary('yes', 'no') }}"
  ansible.builtin.file:
    group: "{{ ansible_facts.user_gid }}"
    owner: "{{ ansible_facts.user_id }}"
    path: "{{ fonts_dir }}"
    recurse: true
    state: directory
  tags:
    - fonts

- name: Determine directory name for font
  ansible.builtin.set_fact:
    font_dir: "{{ font | regex_replace('^([^/]+)/.*$', '\\1') }}"
  tags:
    - fonts

- name: Create font directory for {{ font_dir }}
  ansible.builtin.file:
    group: "{{ ansible_facts.user_gid }}"
    owner: "{{ ansible_facts.user_id }}"
    path: "{{ fonts_dir }}/{{ font_dir }}"
    state: directory
  tags:
    - fonts

- name: Download {{ font | basename }}.
  ansible.builtin.get_url:
    dest: "{{ fonts_dir }}/{{ font_dir }}/{{ font | basename }}"
    group: "{{ ansible_facts.user_gid }}"
    owner: "{{ ansible_facts.user_id }}"
    url: "https://github.com/ryanoasis/nerd-fonts/raw/{{ nerdfonts_version }}/patched-fonts/{{ font | regex_replace(' ', '%20') }}"
  tags:
    - fonts
