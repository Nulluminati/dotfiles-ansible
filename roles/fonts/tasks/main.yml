---
- name: Remove legacy Hack Nerd Font files
  ansible.builtin.file:
    path: "{{ fedora_font_dir }}/Hack/{{ item }}"
    state: absent
  loop:
    - Hack Regular Nerd Font Complete.ttf
    - Hack Bold Nerd Font Complete.ttf
  when: ansible_facts.distribution == 'Fedora'
  register: legacy_hack_fonts
  tags:
    - fonts

- name: Install Herdr agent icon font
  ansible.builtin.import_tasks: herdr_agent_icons.yml
  tags:
    - fonts
    - herdr

- name: Download Font
  ansible.builtin.include_tasks: "nerdfonts.yml"
  loop: "{{ fonts }}"
  loop_control:
    loop_var: font
  tags:
    - fonts

- name: Build Hack fonts with Herdr agent icons
  ansible.builtin.import_tasks: herdr_agent_icons_mac.yml
  tags:
    - fonts
    - herdr

- name: Refresh font cache after removing legacy fonts
  ansible.builtin.command: fc-cache -f
  when:
    - ansible_facts.distribution == 'Fedora'
    - legacy_hack_fonts is changed
  tags:
    - fonts
