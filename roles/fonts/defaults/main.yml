---
fedora_font_dir: "{{ ansible_env.HOME }}/.local/share/fonts/NerdFonts"
mac_font_dir: "{{ ansible_env.HOME }}/Library/Fonts"

# Repo path layout: patched-fonts/<Font>/<Font>-<Style>.ttf since nerd-fonts v3.
nerdfonts_version: v3.5.1

fonts: 
  - 'Hack/HackNerdFont-Regular.ttf'
  - 'Hack/HackNerdFont-Bold.ttf'
  - 'Hack/HackNerdFont-Italic.ttf'
