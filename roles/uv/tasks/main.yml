---
- name: Install uv
  ansible.builtin.shell: curl -LsSf https://astral.sh/uv/install.sh | sh
  args:
    creates: ~/.local/bin/uv
  tags:
    - uv

- name: Install additional uv python versions
  ansible.builtin.shell: uv python install {{ item }}
  loop: "{{ add_python_versions }}"
  tags:
    - uv
    - python

- name: Install uv tools
  ansible.builtin.shell: uv tool install {{ item }}
  loop: "{{ packages }}"
  tags:
    - uv
    - tools

- name: Install mac uv tools
  ansible.builtin.shell: uv tool install {{ item }}
  loop: "{{ mac_packages }}"
  when: ansible_facts.distribution == "MacOSX"
  tags:
    - uv
    - tools

- name: Install fedora uv tools
  ansible.builtin.shell: uv tool install {{ item }}
  loop: "{{ fedora_packages }}"
  when: ansible_facts.distribution == "Fedora"
  tags:
    - uv
    - tools

- name: Setup maestral
  ansible.builtin.import_tasks: maestral.yml
  when: ansible_facts.distribution == "Fedora"
  tags:
    - maestral
    - dropbox
