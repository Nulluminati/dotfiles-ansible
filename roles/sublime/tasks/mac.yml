---
# TODO : Install Sublime Text

# Create Directoris

- name: Check Sublime installed package directory
  stat:
    path: "{{ ansible_env.HOME }}/Library/Application Support/Sublime Text/Installed Packages"
  register: check_sublime_installed_packages_dir
  tags:
    - sublime
    - config

- name: Create Sublime installed package directory
  file:
    path: "{{ ansible_env.HOME }}/Library/Application Support/Sublime Text/Installed Packages"
    state: directory
  when: check_sublime_installed_packages_dir.stat.exists == False
  tags:
    - sublime
    - config

- name: Check Sublime package directory
  stat:
    path: "{{ ansible_env.HOME }}/Library/Application Support/Sublime Text/Packages"
  register: check_sublime_packages_dir
  tags:
    - sublime
    - config

- name: Create Sublime Package directory
  file:
    path: "{{ ansible_env.HOME }}/Library/Application Support/Sublime Text/Packages"
    state: directory
  when: check_sublime_packages_dir.stat.exists == False
  tags:
    - sublime
    - config


# Install Package Control

- name: Install package control for Sublime
  get_url:
    url: "https://packagecontrol.io/Package%20Control.sublime-package"
    dest: "{{ ansible_env.HOME }}/Library/Application Support/Sublime Text/Installed Packages/Package Control.sublime-package"
  tags:
    - sublime
    - packagecontrol

# Install Packages

- name: Install Sublime plugins
  git:
    repo: "{{ item.name | default(item) }}"
    version: "{{ item.version | default('master') }}"
    dest: "{{ ansible_env.HOME }}/Library/Application Support/Sublime Text/Packages/{{ item.name | default(item) | regex_replace('^.+/([^/.]+)(\\.git)*$','\\1') }}"
    accept_hostkey: "yes"
  with_items: "{{ sublime_packages }}"
  tags:
    - sublime
    - plugins

# Install Helm LSP dependencies

- name: Ensure local bin directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.local/bin"
    state: directory
    mode: '0755'
  tags:
    - sublime
    - helm-ls

- name: Download helm-ls
  ansible.builtin.get_url:
    url: "https://github.com/mrjosh/helm-ls/releases/download/master/helm_ls_darwin_amd64"
    dest: "{{ ansible_env.HOME }}/.local/bin/helm_ls"
    mode: '0755'
    timeout: 30
  tags:
    - sublime
    - helm-ls

- name: Install yaml-language-server
  community.general.npm:
    name: yaml-language-server
    global: true
    state: present
  tags:
    - sublime
    - helm-ls

# macOS system Ruby (2.6) is too old for ruby-lsp's prism dependency (needs
# >= 2.7). Use the newest chruby-managed Ruby's gem instead of bare `gem`.
- name: Find newest chruby-managed Ruby gem executable
  ansible.builtin.shell: ls -d {{ ansible_env.HOME }}/.rubies/*/bin/gem | sort -V | tail -1
  register: chruby_gem
  changed_when: false
  check_mode: false
  failed_when: chruby_gem.rc != 0 or chruby_gem.stdout == ""
  tags:
    - sublime
    - ruby-lsp

# community.general.gem checks installed state via `gem query`, which was
# removed in RubyGems 4. Use `gem list -e` directly to stay compatible.
- name: Check if ruby-lsp gem is installed
  ansible.builtin.command: "{{ chruby_gem.stdout }} list -e ruby-lsp"
  register: ruby_lsp_check
  changed_when: false
  check_mode: false
  tags:
    - sublime
    - ruby-lsp

# Route the executable wrappers into ~/.local/bin (on PATH) so Sublime's LSP
# config can invoke `ruby-lsp` bare, matching the helm_ls convention above.
- name: Install ruby-lsp gem
  ansible.builtin.command: "{{ chruby_gem.stdout }} install ruby-lsp --user-install --bindir {{ ansible_env.HOME }}/.local/bin"
  when: "'ruby-lsp' not in ruby_lsp_check.stdout"
  tags:
    - sublime
    - ruby-lsp

- name: Ensure Sublime User directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/Library/Application Support/Sublime Text/Packages/User"
    state: directory
    mode: '0755'
  tags:
    - sublime
    - helm-ls

- name: Configure LSP settings for helm-ls
  ansible.builtin.template:
    src: templates/LSP.sublime-settings.j2
    dest: "{{ ansible_env.HOME }}/Library/Application Support/Sublime Text/Packages/User/LSP.sublime-settings"
    mode: '0644'
  tags:
    - sublime
    - helm-ls
    - ruby-lsp
