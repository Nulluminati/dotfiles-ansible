---
- name: Install Stow in Fedora
  become: true
  dnf:
    name:
      - stow
    state: present
  tags:
    - packages

- name: Build directories list
  ansible.builtin.find:
    paths: ["dotfiles/fedora"]
    recurse: no
    file_type: directory
  register: files
  tags:
    - stow
    - dotfiles

- name: Deploy dotfiles
  with_items: '{{ files.files }}'
  environment:
    STOW_DIR: "dotfiles/fedora"
  ansible.builtin.shell: |
    stow -v -t {{ ansible_env.HOME }} {{ item.path | basename }}
  register: output
  changed_when: '"LINK" in output.stderr'
  tags:
    - stow
    - dotfiles

# The voice mic bridge unit is deployed by the voice Stow package above.
- name: Reload systemd user daemon
  ansible.builtin.systemd:
    scope: user
    daemon_reload: true
  tags:
    - stow
    - dotfiles

- name: Enable and start voice-mic-bridge service
  ansible.builtin.systemd:
    scope: user
    name: voice-mic-bridge.service
    enabled: true
    state: started
  tags:
    - stow
    - dotfiles
