---
- name: Check if homebrew is available
  tags:
    - stow
    - homebrew
  block:
    - name: Check if brew command exists
      ansible.builtin.raw: which brew
      check_mode: false
      changed_when: false
      failed_when: which_res.rc > 0
      register: which_res

- name: Install Stow in Mac
  community.general.homebrew:
    name: stow
    state: present
  tags:
    - packages
    - homebrew

- name: Build directories list
  ansible.builtin.find:
    paths: ["dotfiles/mac"]
    recurse: false
    file_type: directory
  register: files
  tags:
    - stow
    - dotfiles

- name: Deploy dotfiles
  with_items: '{{ files.files }}'
  environment:
    STOW_DIR: "dotfiles/mac"
  ansible.builtin.shell: |
    stow -v -t {{ ansible_facts.env.HOME }} {{ item.path | basename }}
  register: output
  changed_when: '"LINK" in output.stderr'
  tags:
    - stow
    - dotfiles
