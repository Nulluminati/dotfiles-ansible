---
herdr_plugins:
  - id: nulluminati.agent-icons
    source: Nulluminati/herdr-extensions/plugins/agent-icons
    tags: [install, herdr]
  # Herdr workspace templates and quick actions (https://github.com/cloudmanic/herdr-plus)
  - id: cloudmanic.herdr-plus
    source: cloudmanic/herdr-plus
    tags: [install, herdr, herdr-plus]
  # Review agent diffs in Hunk and send inline comments back to the agent (https://github.com/jhochenbaum/herdr-hunk-diff)
  - id: jhochenbaum.hunkdiff
    source: jhochenbaum/herdr-hunk-diff
    tags: [install, herdr, hunk]

# Bun packages to install globally
bun_tools:
  - "@mariozechner/pi-coding-agent"
  - "@openai/codex@latest"
  - "@let-it-cook/cli"
  - happy-coder
  - skills

# Agent skills to install globally via skills CLI
agent_skills:
  - "anthropics/skills@skill-creator"
  - "anthropics/skills@frontend-design"
  - "softaworks/agent-toolkit@mermaid-diagrams"
  - "softaworks/agent-toolkit@humanizer"
  - "softaworks/agent-toolkit@agent-md-refactor"
  - "wshobson/agents@uv-package-manager"
  - "wshobson/agents@code-review-excellence"
  - "Nulluminati/herdr-extensions@peer-review"
  - "Nulluminati/herdr-extensions@herdboard"

mcp_servers:
  - name: brave-search
    command: "npx -y @modelcontextprotocol/server-brave-search"
    env:
      BRAVE_API_KEY: "{{ api_keys.brave }}"
  - name: context7
    command: "npx -y @upstash/context7-mcp"
  - name: grep_app
    transport: http
    url: "https://mcp.grep.app"

fedora_mcp_servers: []

mac_mcp_servers:
  # - name: honeycomb
  #   transport: http
  #   url: "https://mcp.honeycomb.io/mcp"
  - name: linear
    transport: sse
    url: "https://mcp.linear.app/sse"
  # - name: sentry
  #   transport: http
  #   url: "https://mcp.sentry.dev/mcp"
