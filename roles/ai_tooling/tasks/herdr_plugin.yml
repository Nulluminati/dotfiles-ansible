---
# Clone only when the directory is missing; never touch a working clone
- name: Clone {{ herdr_plugin.id }}
  ansible.builtin.git:
    repo: "{{ herdr_plugin.repo }}"
    dest: "{{ herdr_plugin.path }}"
    update: false
    accept_hostkey: true
  when: herdr_plugin.repo is defined

- name: Check whether {{ herdr_plugin.id }} is installed
  ansible.builtin.command:
    argv:
      - herdr
      - plugin
      - list
      - --plugin
      - "{{ herdr_plugin.id }}"
      - --json
  register: herdr_installed_plugin
  changed_when: false
  check_mode: false
  when: herdr_check.rc == 0 or not ansible_check_mode

- name: Link {{ herdr_plugin.id }} from local clone
  ansible.builtin.command:
    argv:
      - herdr
      - plugin
      - link
      - "{{ herdr_plugin.path }}"
  when:
    - herdr_plugin.path is defined
    - >-
      herdr_installed_plugin is skipped or
      (herdr_installed_plugin.stdout | from_json).result.plugins |
      selectattr('plugin_root', 'equalto', herdr_plugin.path) | list | length == 0

- name: Install {{ herdr_plugin.id }} from GitHub
  ansible.builtin.command:
    argv:
      - herdr
      - plugin
      - install
      - "{{ herdr_plugin.source }}"
      - --yes
  when:
    - herdr_plugin.source is defined
    - >-
      herdr_installed_plugin is skipped or
      (herdr_installed_plugin.stdout | from_json).result.plugins |
      selectattr('source.kind', 'equalto', 'github') | list | length == 0
