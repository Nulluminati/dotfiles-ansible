---
# Review agent diffs in Hunk and send inline comments back to the agent (https://github.com/jhochenbaum/herdr-hunk-diff)
- name: Check whether herdr-hunk-diff is installed
  ansible.builtin.command:
    argv:
      - herdr
      - plugin
      - list
      - --plugin
      - jhochenbaum.hunkdiff
      - --json
  register: herdr_hunk_diff_plugins
  changed_when: false
  check_mode: false
  when: herdr_check.rc == 0 or not ansible_check_mode

- name: Install herdr-hunk-diff
  ansible.builtin.command:
    argv:
      - herdr
      - plugin
      - install
      - jhochenbaum/herdr-hunk-diff
      - --yes
  when: herdr_hunk_diff_plugins is skipped or (herdr_hunk_diff_plugins.stdout | from_json).result.plugins | length == 0
