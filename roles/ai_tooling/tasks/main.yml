---
# Claude Code and MCP Servers
- name: Install Claude Code and MCP servers
  import_tasks: claude_code.yml

# Herdr agent runtime
- name: Install Herdr
  import_tasks: herdr.yml
  tags:
    - herdr-plus
    - hunk

- name: Install Herdr Plus
  import_tasks: herdr_plus.yml
  tags:
    - install
    - herdr
    - herdr-plus

- name: Install herdr-hunk-diff
  import_tasks: herdr_hunk_diff.yml
  tags:
    - install
    - herdr
    - hunk

# Bun tools (AI CLI tools and skills CLI)
- name: Install bun tools
  ansible.builtin.shell:
    cmd: "~/.bun/bin/bun install -g {{ item }}"
  loop: "{{ bun_tools }}"
  tags:
    - bun_tools
    - bun

# Hunk and its GitHub review extension
- name: Install Hunk review tools
  import_tasks: hunk.yml
  tags:
    - install
    - hunk

- name: Install skills globally
  ansible.builtin.shell:
    cmd: "skills add {{ item }} -g -y"
  loop: "{{ agent_skills }}"
  tags:
    - skills

# Pi is installed globally via bun_tools in defaults/main.yml
