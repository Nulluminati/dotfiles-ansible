---
# Claude Code and MCP Servers
- name: Install Claude Code and MCP servers
  ansible.builtin.import_tasks: claude_code.yml

# Herdr agent runtime
- name: Install Herdr
  ansible.builtin.import_tasks: herdr.yml
  tags:
    - herdr-plus
    - hunk

- name: Install Herdr plugins
  ansible.builtin.include_tasks:
    file: herdr_plugin.yml
    apply:
      tags: "{{ herdr_plugin.tags }}"
  loop: "{{ herdr_plugins }}"
  loop_control:
    loop_var: herdr_plugin
    label: "{{ herdr_plugin.id }}"
  tags:
    - install
    - herdr
    - herdr-plus
    - hunk

# The herdr-plus projects and quick actions run bin/herdr_workflow.py from
# their config directory. The script lives in the nulluminati.workflow plugin.
- name: Link the herdr-plus workflow script from the workflow plugin
  ansible.builtin.file:
    src: "{{ herdr_extensions_dir }}/plugins/workflow/bin"
    dest: "{{ ansible_facts.env.HOME }}/.config/herdr/plugins/config/cloudmanic.herdr-plus/bin"
    state: link
    force: true
  tags:
    - install
    - herdr
    - herdr-plus

# The herdboard CLI runs from the local clone, so edits there take effect at once.
- name: Install the herdboard CLI from the local clone
  ansible.builtin.command:
    argv:
      - uv
      - tool
      - install
      - --editable
      - "{{ herdboard_dir }}"
  tags:
    - install
    - herdr

# Browser for agents inside Herdr panes
- name: Install terminal-browser
  ansible.builtin.import_tasks: terminal_browser.yml
  tags:
    - terminal-browser

# Bun tools (AI CLI tools and skills CLI)
- name: Read global bun packages
  ansible.builtin.slurp:
    src: "{{ ansible_facts.env.HOME }}/.bun/install/global/package.json"
  register: bun_global_package
  failed_when: false
  tags:
    - bun_tools
    - bun

- name: Remove retired bun tools
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts.env.HOME }}/.bun/bin/bun"
      - remove
      - -g
      - "{{ item }}"
  loop: "{{ bun_retired_tools }}"
  when:
    - bun_global_package.content is defined
    - item in ((bun_global_package.content | b64decode | from_json).dependencies | default({}))
  tags:
    - bun_tools
    - bun

- name: Install bun tools
  ansible.builtin.shell:
    cmd: "~/.bun/bin/bun install -g {{ item }}"
  loop: "{{ bun_tools }}"
  tags:
    - bun_tools
    - bun

# Hunk and its GitHub review extension
- name: Install Hunk review tools
  ansible.builtin.import_tasks: hunk.yml
  tags:
    - install
    - hunk

# `skills add` installs a missing skill and rebuilds an installed one, but it
# always reports "installed". Split the work so Ansible reports real changes:
# add the missing skills, then refresh the installed ones with `skills update`.
- name: Read the installed global skills
  ansible.builtin.command:
    argv:
      - skills
      - list
      - -g
      - --json
  register: agent_skill_list
  changed_when: false
  check_mode: false
  tags:
    - skills

- name: Record the managed skill names and the installed ones
  ansible.builtin.set_fact:
    agent_skill_names: "{{ agent_skills | map('regex_replace', '^.*@', '') | list }}"
    agent_skill_names_installed: >-
      {{ (agent_skill_list.stdout | from_json)
         | selectattr('status', 'ne', 'missing')
         | map(attribute='name')
         | list }}
  tags:
    - skills

- name: Install the missing skills globally
  ansible.builtin.command:
    argv:
      - skills
      - add
      - "{{ item }}"
      - -g
      - -y
  loop: "{{ agent_skills }}"
  when: (item | regex_replace('^.*@', '')) not in agent_skill_names_installed
  changed_when: true
  tags:
    - skills

- name: Update the installed skills globally
  ansible.builtin.command:
    argv: "{{ ['skills', 'update'] + managed_installed_skills + ['-g', '-y'] }}"
  vars:
    managed_installed_skills: "{{ agent_skill_names | intersect(agent_skill_names_installed) }}"
  when: managed_installed_skills | length > 0
  register: agent_skill_update
  changed_when: "'Updated' in agent_skill_update.stdout"
  tags:
    - skills

# Pi is installed globally via bun_tools in defaults/main.yml
