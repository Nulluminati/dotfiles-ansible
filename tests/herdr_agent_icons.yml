---
# Run: ANSIBLE_ROLES_PATH=roles ansible-playbook -i localhost, tests/herdr_agent_icons.yml
- name: Test Herdr agent icon setup without changing the user environment
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    fonts: []
    herdr_check:
      rc: 0
  tasks:
    - name: Create isolated test directory
      tempfile:
        state: directory
        suffix: .herdr-agent-icons
      register: sandbox

    - name: Test setup and repeated execution
      block:
        - name: Create test directories
          file:
            path: "{{ sandbox.path }}/{{ item }}"
            state: directory
          loop:
            - bin
            - clone/plugins/agent-icons

        - name: Set isolated paths
          set_fact:
            ansible_facts:
              distribution: Fedora
              env:
                HOME: "{{ sandbox.path }}"
            herdr_agent_icons_plugin_path: "{{ sandbox.path }}/clone/plugins/agent-icons"
            herdr_agent_icons_font_url: "file://{{ sandbox.path }}/source.ttf"

        - name: Create test font
          copy:
            content: test font data
            dest: "{{ sandbox.path }}/source.ttf"

        - name: Create mock font cache command
          copy:
            dest: "{{ sandbox.path }}/bin/fc-cache"
            mode: '0755'
            content: |
              #!/bin/sh
              printf '%s\n' "$*" >> '{{ sandbox.path }}/cache-calls'

        - name: Create mock Herdr command
          copy:
            dest: "{{ sandbox.path }}/bin/herdr"
            mode: '0755'
            content: |
              #!/bin/sh
              case "$*" in
                'plugin list --plugin nulluminati.agent-icons --json')
                  if test -f '{{ sandbox.path }}/linked'; then
                    printf '%s\n' '{"result":{"plugins":[{"plugin_id":"nulluminati.agent-icons","plugin_root":"{{ herdr_agent_icons_plugin_path }}"}]}}'
                  elif test -f '{{ sandbox.path }}/stale'; then
                    printf '%s\n' '{"result":{"plugins":[{"plugin_id":"nulluminati.agent-icons","plugin_root":"/deleted/worktree/plugins/agent-icons"}]}}'
                  else
                    printf '%s\n' '{"result":{"plugins":[]}}'
                  fi ;;
                'plugin link {{ herdr_agent_icons_plugin_path }}')
                  printf '%s\n' "$3" >> '{{ sandbox.path }}/linked' ;;
                *) printf 'Unexpected Herdr arguments: %s\n' "$*" >&2; exit 1 ;;
              esac

        - name: Deploy Fedora Fontconfig package with Stow
          command:
            argv:
              - stow
              - --dir
              - "{{ playbook_dir }}/../dotfiles/fedora"
              - --target
              - "{{ sandbox.path }}"
              - fontconfig

        - name: Read deployed Fontconfig rule
          slurp:
            src: "{{ sandbox.path }}/.config/fontconfig/conf.d/50-herdr-agent-icons.conf"
          register: deployed_fontconfig

        - name: Run font role
          include_role:
            name: fonts

        - name: Flush font cache handler
          meta: flush_handlers

        - name: Repeat font role
          include_role:
            name: fonts

        - name: Flush font cache handler after repeat
          meta: flush_handlers

        - name: Run plugin setup twice
          include_tasks: ../roles/ai_tooling/tasks/herdr_agent_icons.yml
          loop: [1, 2]
          loop_control:
            loop_var: test_iteration

        - name: Verify installed font
          slurp:
            src: "{{ sandbox.path }}/.local/share/fonts/HerdrAgentIconsMax-Regular.ttf"
          register: installed_font

        - name: Verify font contents and idempotent commands
          assert:
            that:
              - installed_font.content | b64decode == 'test font data'
              - lookup('file', sandbox.path + '/cache-calls') == '-f'
              - lookup('file', sandbox.path + '/linked') == herdr_agent_icons_plugin_path

        - name: Remove mock link
          file:
            path: "{{ sandbox.path }}/linked"
            state: absent

        - name: Simulate stale worktree link
          copy:
            content: stale
            dest: "{{ sandbox.path }}/stale"

        - name: Run plugin setup against stale link twice
          include_tasks: ../roles/ai_tooling/tasks/herdr_agent_icons.yml
          loop: [1, 2]
          loop_control:
            loop_var: test_iteration

        - name: Verify stale link replacement and repeat execution
          assert:
            that:
              - lookup('file', sandbox.path + '/linked') == herdr_agent_icons_plugin_path

        - name: Verify managed terminal and sidebar settings
          assert:
            that:
              - "'Herdr Agent Icons Max' in (deployed_fontconfig.content | b64decode)"
              - "deployed_fontconfig.content | b64decode == lookup('file', '../dotfiles/fedora/fontconfig/.config/fontconfig/conf.d/50-herdr-agent-icons.conf', rstrip=false)"
              - "'font-codepoint-map = U+E1A0-U+E1BA=Herdr Agent Icons Max' in lookup('file', '../dotfiles/shared/ghostty/config')"
              - "lookup('file', '../dotfiles/shared/herdr/config.toml').count('$agent_icon') == 3"
      environment:
        PATH: "{{ sandbox.path }}/bin:{{ lookup('env', 'PATH') }}"
      always:
        - name: Remove isolated test directory
          file:
            path: "{{ sandbox.path }}"
            state: absent
