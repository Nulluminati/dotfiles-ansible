---
- name: Bootstrap development environment
  connection: local
  hosts: localhost
  tasks:
    - name: Python uv
      tags: uv
      ansible.builtin.import_role:
        name: uv
    - name: LLM
      tags: llm
      ansible.builtin.import_role:
        name: llm
    - name: CLI Tools
      tags: cli
      ansible.builtin.import_role:
        name: cli
    - name: AI Tooling
      tags: ai_tooling
      ansible.builtin.import_role:
        name: ai_tooling
    - name: Stow
      tags: stow
      ansible.builtin.import_role:
        name: stow
    - name: Fonts
      tags: fonts
      ansible.builtin.import_role:
        name: fonts
    - name: Sublime Text
      tags: sublime
      ansible.builtin.import_role:
        name: sublime
